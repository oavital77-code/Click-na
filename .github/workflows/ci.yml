# The gate every change passes: lint, types, and the full test suite — unit
# tests and the integration tests that talk to a real Postgres, because the
# schedule logic is enforced by database constraints and a mock would not
# exercise them.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # A throwaway database inside the runner. Not a secret.
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cleana_test?schema=public

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cleana_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `postinstall` runs `prisma generate`, so the client exists from here on.
      - run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      # `PageProps`, `LayoutProps` and `RouteContext` are globals Next generates
      # from the route tree — normally as a side effect of `next dev` or
      # `next build`. A clean checkout has never run either, so `tsc` alone
      # would fail on every dynamic route with "Cannot find name". `typegen`
      # emits exactly those types without paying for a full build.
      - name: Generate route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test
        run: npm test
