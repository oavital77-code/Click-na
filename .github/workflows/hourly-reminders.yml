# Sends due appointment reminders every hour.
#
# Vercel's free plan runs the app's own cron once a day (vercel.json), which
# is enough for billing but not for "a reminder N hours before the session".
# This calls the same endpoint every hour with ?scope=reminders, which only
# sends reminders; the daily Vercel run still does billing and the rest.
#
# Needs one repository secret, CRON_SECRET, equal to CRON_SECRET in Vercel
# (Settings → Secrets and variables → Actions → New repository secret).
name: Hourly reminders

on:
  schedule:
    - cron: "7 * * * *" # every hour at :07 (UTC); GitHub may start it a few minutes late
  workflow_dispatch: {} # "Run workflow" button, for a manual test

permissions: {}

concurrency:
  group: hourly-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the reminders endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Repository secret CRON_SECRET is not set"
            exit 1
          fi
          status=$(curl -sS -o response.json -w "%{http_code}" --max-time 75 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://cleanaplus.cleanagroup.app/api/cron/send-reminders?scope=reminders")
          cat response.json; echo
          if [ "$status" != "200" ]; then
            echo "::error::Reminders endpoint answered $status"
            exit 1
          fi
