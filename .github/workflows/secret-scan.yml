# Gitleaks — scans the WHOLE git history, not just the current tree, for
# anything shaped like a live credential. This is the gate that matters before
# the repository is made public: a key deleted in a later commit is still
# readable in the commit that added it.
#
# Runs the released binary directly rather than gitleaks-action, which asks
# organisation accounts for a licence key. No licence, no third-party token.
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "40 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history — a shallow clone would scan only the tip and miss
          # exactly the case this job exists for.
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.28.0
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Scan full history
        run: gitleaks git --config .gitleaks.toml --redact --verbose --exit-code 1 .
