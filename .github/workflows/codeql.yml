# CodeQL — GitHub's own static analysis. Finds injection, unsafe redirects,
# hardcoded credentials and the rest of the CWE catalogue in our TypeScript.
#
# Free on public repositories. On a private repository this workflow still runs
# but the results need GitHub Code Security, so it is expected to fail the
# upload step there — that failure is informational, not a broken build.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Monday 04:20 UTC — catches newly published query packs against old code.
    - cron: "20 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # JS/TS needs no compilation, so CodeQL reads the sources directly
          # instead of trying to autobuild a Next.js app.
          build-mode: none
          queries: security-and-quality

      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript-typescript"
