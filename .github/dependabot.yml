# Dependabot alerts and version updates are free on private repositories too,
# so this is useful from the moment it lands, regardless of visibility.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # One pull request per ecosystem instead of a dozen — a framework bump is
      # reviewed as a unit anyway.
      next:
        patterns: ["next", "@next/*", "eslint-config-next"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      prisma:
        patterns: ["prisma", "@prisma/*"]
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
